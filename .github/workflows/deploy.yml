name: Java CI with Maven

on:
  push:
    branches:
      - main
      - feature/dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compiler, tester et generer la couverture
        run: mvn -B -ntp clean verify

      - name: Conserver le JAR et les rapports
        uses: actions/upload-artifact@v7
        with:
          name: resultats-build
          path: |
            target/*.jar
            target/site/jacoco/
            target/surefire-reports/
          retention-days: 7
          if-no-files-found: error